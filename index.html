function projectedTime(ms,remaining){
 const initial=status(ms),end=midnight(initial.day)+dayMs;
 let cursor=ms;
 while(cursor<end){
   const state=status(cursor);
   if(state.work!==initial.work||state.timed!==initial.timed)return null;
   const next=boundary(cursor,end,state);
   if(!state.meal&&!state.pause){
     if(remaining<next-cursor)return cursor+remaining;
     remaining-=next-cursor;
   }
   cursor=next;
 }
 return null
}

   if(idleMs>=minute)activeSince=null;else activeSince??=ms-idleMs;
   if(idleMs<20000)markActive(ms-idleMs);
 });
 window.blinkDesktop.onPrompt?.((id,action)=>answerPrompt(id,action));
 window.blinkDesktop.onQuiet?.((until,id)=>{quietUntil=until;if(data.card?.id===id){data.card=null;save()}});
 window.blinkDesktop.onUpdate?.(version=>say('新版本 '+version+' 已下载，退出时自动安装'));
 // Tray menu commands.
 window.blinkDesktop.onCommand?.(command=>{
   settle();const st=status(Date.now()),next=reminders()[0];
   if(command==='rest'){if(next!=null&&next<2)takeReminder(next);else pauseFor(1,restDuration(1))}
   else if(command==='pause'){settle();data.pause={from:Date.now(),until:Date.now()+60*minute,kind:-1};if(data.card){clearSystemCard(data.card);data.card=null}save();render();say('已暂停提醒 1 小时',{undo:resume})}
   else if(command==='shift'){if(st.work)offNow();else workNow()}
   else if(command==='checkin'&&next!=null)takeReminder(next);
 });
}
// The tray shows the same capsule and countdown as the home screen.
let traySent='';
function pushTray(){
 if(!window.blinkDesktop?.status)return;
 const st=status(Date.now()),next=reminders()[0];
 const waiting=st.away?'已暂停':st.meal?st.meal+'中':st.pause?'休息中':next==null?'提醒已关闭':kinds[next]+' '+(left(next)?Math.ceil(left(next)/minute)+' 分钟后':'现在');
 const payload=JSON.stringify({capsule:capsuleText(st),next:waiting,work:st.work});
 if(payload!==traySent){traySent=payload;window.blinkDesktop.status(JSON.parse(payload))}
}
if(!window.blinkMobile&&!window.blinkDesktop&&'serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',event=>{
 if(event.data?.type==='blink-reminder')openReminder(event.data.id,event.data.confirm)
});
if(window.blinkCloudNative&&window.BlinkAccounts){
  window.blinkAccounts=window.BlinkAccounts({
    native:window.blinkCloudNative, modal, say, render, settle, save, createState, loadMealTimes, dayKey, midnight,
    get:()=>data, getKey:()=>key, guestKey,
    lastActive:()=>data.lastActive,
    switchTo:(nextKey,state)=>{
      data=loadMealTimes(state);key=nextKey;
      if(!save())throw Error('保存失败');
      localStorage.setItem('blink-active-profile',key);localStorage.removeItem('blink-pending');
      nativePlanSignature='';posted='';openedReminder=null;paintCard(null);applyTheme();render();
    }
  });
}
render();refreshCalendar();setTimeout(askAutoStart,1500);
const landing=new URLSearchParams(location.hash.slice(1));
if(landing.has('reminder')){openReminder(landing.get('reminder'),landing.get('action')==='confirm');history.replaceState(null,'',location.href.split('#')[0])}
function scheduleTick(){
 clearTimeout(tickTimer);
 if(!pageHidden()){tickTimer=setTimeout(tick,1000);return}
 // Hidden Android web view: native alarms deliver reminders; wake only for start/end questions.
 if(window.blinkMobile){
   const ms=Date.now(),day=dayKey(ms),plan=dayPlan(day),o=plan.o;
   const edges=[at(day,plan.start),at(day,plan.end)+1000,o.ask?o.ask+30*minute+1000:0,midnight(day)+dayMs+1000].filter(x=>x>ms);
   tickTimer=setTimeout(tick,Math.min(15*minute,Math.max(1000,Math.min(...edges)-ms)));return
 }
 if(!systemEnabled())return;
 const ms=Date.now(),st=status(ms);
 let next=boundary(ms,ms+dayMs,st);
 if(!st.meal&&!st.pause&&!st.away){
   if(data.card)next=Math.min(next,data.card.until);
   else{
     const delay=st.work||st.planned||st.timed?Math.min(...reminders().map(k=>left(k))):0;
     if(delay||reminders().some(k=>!left(k)))next=Math.min(next,Math.max(ms+delay,data.nextCardAt||0));
   }
 }
 tickTimer=setTimeout(tick,Math.max(250,next-ms))
}
function tick(){
 settle();checkDay();checkReminder();pushTray();
 if(!pageHidden()&&viewKey()!==painted){render();return}
 if(!pageHidden())updateText();
 if(Date.now()-lastSaved>=10000){save();lastSaved=Date.now()}
 scheduleTick()
}
</script></body></html>
