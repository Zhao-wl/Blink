<script src="sync.js"></script><script src="account.js"></script><script>

const dateFormat=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'});
const clockFormat=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const now=()=>new Date(),dayKey=d=>dateFormat.format(d),time=d=>clockFormat.format(d);
const midnight=day=>Date.parse(day+'T00:00:00+08:00');
const at=(day,hm)=>Date.parse(day+'T'+hm+':00+08:00');
const minute=60000,dayMs=86400000;
const calendar={
  2026:{off:[[101,103],[215,223],[404,406],[501,505],[619,621],[925,927],[1001,1007]],on:[104,214,228,509,920,1010]},
  2027:{off:[[101,103],[205,213],[403,405],[501,505],[609,609],[915,915],[1001,1007]],on:[131,214,508,926,1009]}
};
function dayType(date){
  const rules=calendar[date.slice(0,4)],md=Number(date.slice(5).replace('-',''));
  if(!rules)return '日历待更新';
  if(rules.on.includes(md))return '调休上班';
  if(rules.off.some(([start,end])=>md>=start&&md<=end))return '节假日';
  return [0,6].includes(new Date(date+'T12:00:00Z').getUTCDay())?'周末':'工作日';
}

function createState(useLegacy=true){
  let old={};try{old=useLegacy?(JSON.parse(localStorage.getItem(legacyKey))||{}):{}}catch{}
  const start=Date.now(),totals={};
  const spans=[...(old.eyeSessions||[])];if(old.eyeStart!=null)spans.push([old.eyeStart,start]);
  for(let [a,b] of spans){while(Number.isFinite(a)&&a<b){const day=dayKey(a),end=Math.min(b,midnight(day)+dayMs);totals[day]=(totals[day]||0)+end-a;a=end}}
  return {start:old.start||'09:00',end:old.end||'18:00',lunchStart:old.lunchStart||'12:00',lunchEnd:old.lunchEnd||'13:00',
    freq:[old.freq?.[0]??20,old.freq?.[1]||20],extraFreq:[[old.extraFreq?.[0]?.[0]??60,0],[old.extraFreq?.[1]?.[0]??90,0]],

let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}data??=createState();
function loadMealTimes(state){
  state.dinnerStart??=state.lunchEnd>'18:00'?state.lunchEnd:'18:00';
  state.dinnerEnd??=state.dinnerStart>'18:30'?state.dinnerStart:'18:30';
  delete state.overtime;
  return state
}
loadMealTimes(data);
const save=()=>{if(data.cloud)window.BlinkSync.observe(data);try{localStorage.setItem(key,JSON.stringify(data));return true}catch{say('本机存储空间不足，请导出备份');return false}};
function status(ms){
  const day=dayKey(ms),type=dayType(day),legal=type==='工作日'||type==='调休上班';
  const shift=data.shift,override=shift&&ms>=shift.from&&ms<shift.until;
  const work=override?shift.work:legal&&ms>=at(day,data.start)&&ms<at(day,data.end);
  let meal='',mealUntil=0;
  if(work){
    if(ms>=at(day,data.lunchStart)&&ms<at(day,data.lunchEnd)){meal='午休';mealUntil=at(day,data.lunchEnd)}
    else if(ms>=at(day,data.dinnerStart)&&ms<at(day,data.dinnerEnd)){meal='晚餐';mealUntil=at(day,data.dinnerEnd)}
    if(meal)mealUntil=Math.min(mealUntil,override?shift.until:at(day,data.end))
  }
  const planned=!work&&data.blocks.some(b=>b.screen&&!b.done&&b.day===day&&ms>=at(day,b.at)&&ms<at(day,b.at)+b.minutes*minute);
  const pause=data.pause&&ms>=data.pause.from&&ms<data.pause.until?data.pause:null;
  const timed=!!(!work&&data.session&&ms>=data.session.from&&ms<data.session.until);
  return {day,work,meal,mealUntil,planned,pause,timed};
}
function boundary(ms,end,st){
  const day=st.day,points=[end,midnight(day)+dayMs,...[data.start,data.lunchStart,data.lunchEnd,data.dinnerStart,data.dinnerEnd,data.end].map(h=>at(day,h)),data.shift?.until,data.pause?.until,data.session?.until];
  for(const b of data.blocks){if(b.day===day&&b.screen&&!b.done){const a=at(day,b.at);points.push(a,a+b.minutes*minute)}}
  return Math.min(...points.filter(x=>x>ms));
}
function context(st){const tag=st.day+':'+st.work+(st.timed?':session':'');if(tag!==data.context){data.context=tag;clearSystemCard(data.card);data.card=null;data.deferredRounds={};data.progress=[0,0,0];data.snooze=[0,0,0]}}
let lastVisibleSample=Date.now(), visible=!document.hidden;
function settle(end=Date.now()){
  // Visible time requires a recent observation. A suspended tab supplies none.
  const observedFrom=visible&&end-lastVisibleSample<5000?lastVisibleSample:end;
  let t=data.cursor;
  while(t<end){
    const st=status(t);context(st);const next=boundary(t,end,st);
    if(!st.meal&&!st.pause){
      const delta=st.work||st.planned||st.timed?next-t:Math.max(0,next-Math.max(t,observedFrom));
      data.totals[st.day]=(data.totals[st.day]||0)+delta;
      if(data.cloud&&delta){window.BlinkSync.span(data,st.day,next-delta,next,midnight(st.day));window.BlinkSync.rebuild(data,st.day)}

  if(data.session&&(end>=data.session.until||status(end).work))data.session=null;
  data.cursor=end;lastVisibleSample=end;context(status(end));
}
function scene(){return status(Date.now()).work?0:1}
function reminderMode(){const st=status(Date.now());return st.work||st.timed?0:1}

}
function log(k,id=crypto.randomUUID()){
  if(!data.logs.some(row=>row.id===id))data.logs.unshift({id,k,at:Date.now()});

}

function duration(ms){const m=Math.floor(ms/minute);return m>=60?Math.floor(m/60)+' 小时 '+m%60+' 分钟':m?m+' 分钟':Math.floor(ms/1000)+' 秒'}

}

function clearSystemCard(card){
 if(card&&typeof window!=='undefined'&&window.blinkDesktop){window.blinkDesktop.clear(card.id);return}
 if(card?.system&&window.blinkMobile){window.blinkMobile.clear(card.id).catch(()=>{});return}
 if(!card?.system||!worker)return;
 worker.then(reg=>reg.getNotifications({tag:'blink-current'})).then(items=>{
   for(const item of items)if(item.data?.id===card.id)item.close()
 }).catch(()=>{})
}
async function postSystem(card){
 const id=card.id,token=id+':'+Number(!!card.retry);
 if(posted===token)return;posted=token;
 try{
   if(window.blinkMobile){await window.blinkMobile.show({...card,rest:restDuration(card.k)},kinds[card.k],reminderMessages[card.k],data.delivery);return}
   if(window.blinkDesktop){window.blinkDesktop.show({...card,sound:!!data.delivery.sound,theme:document.documentElement.dataset.theme});return}
   const reg=await registration();
   if(data.card?.id!==id||!systemEnabled())return;
   const pref=data.delivery,options={tag:'blink-current',renotify:true,body:reminderMessages[card.k]+' 点开打卡。',data:{id},silent:!pref.sound};
   if(pref.sound)options.vibrate=pref.buzz?[160,80,160]:[];
   if(!mobileDevice())options.actions=[{action:'confirm',title:reminderLabels[card.k]}];
   await reg.showNotification('Blink · '+(card.retry?'再次提醒 · ':'')+kinds[card.k],options);
   if(!pref.sound&&pref.buzz&&!document.hidden)navigator.vibrate?.(160);
 }catch{failed=id;if(!document.hidden)paintCard(card)}
}
function openReminder(id,confirm){

 openedReminder=id;tab=0;
 if(confirm)takeReminder(card.k);else render()
}
function delayLabel(k){return data.snooze[k]||data.card?.k===k&&data.card.retry?'跳过本轮':'稍后 5 分钟'}
function deferReminder(k){
  settle();const round=data.card?.round,delay=delayLabel(k)==='跳过本轮'?0:5*minute;
  restart(k,delay);if(delay&&round)(data.deferredRounds??={})[k]=round;render()
}
function paintCard(card){
 const box=el('nudge');
 if(!card){box.hidden=true;box.removeAttribute('data-display');return}
 const k=card.k,again=!!data.snooze[k]||card.retry,display=[k,again,card.until].join('/');
 if(!box.hidden&&box.dataset.display===display)return;
 box.dataset.display=display;box.hidden=false;
 el('nudgeIcon').innerHTML=svg(['eye','rest','water'][k]);
 el('nudgeType').textContent=(again?'本轮最后一次 · ':'')+kinds[k]+'提醒';
 el('nudgeTitle').textContent=reminderMessages[k];el('accept').textContent=reminderLabels[k];
 el('postpone').textContent=again?'跳过本轮':'稍后 5 分钟';
 function act(confirm){
   settle();const st=status(Date.now());
   if(data.card?.until!==card.until||st.meal||st.pause||!frequency(k)||left(k)){render();return}
   if(confirm)takeReminder(k);else deferReminder(k)
 }
 el('accept').onclick=()=>act(true);el('postpone').onclick=()=>act(false)
}
function checkReminder(){
 const ms=Date.now(),st=status(ms);
 if(modal.open&&!document.hidden){paintCard(null);return}
 const useSystem=systemEnabled()&&(window.blinkDesktop||mobileDevice()||document.hidden||!document.hasFocus());
 if(document.hidden&&!useSystem){paintCard(null);return}
 let card=data.card;
 if(card&&(st.pause||st.meal||!frequency(card.k)||left(card.k))){clearSystemCard(card);data.card=null;card=null;save()}
 if(st.pause||st.meal){paintCard(null);return}
 if(card&&!card.id){card.id=crypto.randomUUID();save()}
 if(window.blinkMobile&&document.hidden){paintCard(null);return}
 if(card&&ms>=card.until){
   if(!document.hidden&&!el('nudge').hidden&&el('nudge').contains(document.activeElement))return;
   if(card.system&&!card.retry&&!data.snooze[card.k]&&ms<card.until+5*minute){
     card.retry=true;card.until=ms+5*minute;openedReminder=null;save()
   }else{restart(card.k,card.system||data.snooze[card.k]?0:5*minute);save();card=null}
 }
 if(!card&&ms>=(data.nextCardAt||0)){
   const due=reminders().find(k=>!left(k));
   if(due!=null){
     const period=data.snooze[due]||frequency(due)*minute;
     const round=st.work?(data.deferredRounds?.[due]||roundId(due,ms-Math.max(0,data.progress[due]-period))):undefined;
     card={id:crypto.randomUUID(),k:due,round,system:!!useSystem,until:ms+(useSystem?5*minute:20000)};data.card=card;data.nextCardAt=ms+2*minute;save()}
 }
 if(card?.round&&data.logs.some(row=>row.id===card.round)){
   restart(card.k);paintCard(null);save();return
 }
 if(card&&useSystem&&openedReminder!==card.id&&failed!==card.id){
   if(!card.system){card.system=true;card.until=ms+5*minute;save()}
   postSystem(card);paintCard(null)
 }else paintCard(document.hidden?null:card)
}

function projectedTime(ms,remaining){
 const initial=status(ms),end=midnight(initial.day)+dayMs;
 let cursor=ms;
 while(cursor<end){
   const state=status(cursor);
   if(state.work!==initial.work||state.timed!==initial.timed)return null;
   const next=boundary(cursor,end,state);
   if(!state.meal&&!state.pause){
     if(remaining<next-cursor)return cursor+remaining;
     remaining-=next-cursor;
   }
   cursor=next;
 }
 return null
}
function activityFeed(ms){
 const day=dayKey(ms);
 const rows=data.logs.filter(log=>dayKey(log.at)===day).map(log=>({k:log.k,at:log.at,state:'recorded',log}));
 for(const k of reminders()){
   const predicted=projectedTime(ms,left(k));
   if(predicted!==null)rows.push({k,at:predicted,state:predicted===ms?'due':'upcoming'})
 }
 return rows.sort((a,b)=>a.at-b.at)
}

  const details=el('workPrefs');details.open=frequenciesOpen;details.ontoggle=()=>{if(details.isConnected)frequenciesOpen=details.open};
  const prefs=el('freqs');
  ['远眺','离席休息','喝水'].forEach((name,k)=>frequencyField(prefs,name,k,0));
  const label=document.createElement('label'),select=document.createElement('select');
  label.className='field';label.textContent='每次离席时长';
  for(const n of [5,10,15,20])select.add(new Option(n+' 分钟',n));
  select.value=data.breakMinutes;select.onchange=()=>{data.breakMinutes=Number(select.value);save()};label.append(select);prefs.append(label)
}

// Native mobile OS timers outlive the web view. Queue only a bounded local schedule.
function backgroundPlan(ms){
 const items=[],end=ms+3*dayMs;
 let next=data.progress.map((_,k)=>left(k)),lastContext=data.context,lastDelivery=0;
 for(let t=ms;t<end&&items.length<60;){
   const st=status(t),stop=boundary(t,end,st),tag=st.day+':'+st.work+(st.timed?':session':'');
   const mode=st.work||st.timed?0:1;
   const periods=[data.freq[mode],mode===0?data.extraFreq[0][0]:0,mode===0?data.extraFreq[1][0]:0].map(n=>n*minute);
   if(lastContext!==tag){next=periods.slice();lastContext=tag}
   if(!st.pause&&!st.meal&&(st.work||st.planned||st.timed)){
     while(t<stop&&items.length<60){
       const due=Math.min(...next.filter((_,k)=>periods[k]>0));
       if(!Number.isFinite(due)||t+due>=stop){next=next.map(n=>Math.max(0,n-(stop-t)));break}
       t+=due;next=next.map(n=>Math.max(0,n-due));
       const k=next.findIndex((n,k)=>periods[k]>0&&n===0);
       const fire=Math.max(t,ms+2000,lastDelivery+2*minute);
       if(fire<stop){
         const token=crypto.randomUUID();
         for(const retry of [false,true]){
           const when=fire+(retry?5*minute:0);
           if(when>=stop||items.length>=60)break;
           items.push({slot:items.length+1,token,k,rest:restDuration(k),round:st.work?roundId(k,t):undefined,at:when,expires:Math.min(stop,when+5*minute),retry,title:kinds[k],body:reminderMessages[k]});
           lastDelivery=when;
         }
       }
       next[k]=periods[k]+5*minute;
     }
   }
   t=stop
 }
 return items
}
function faceRows(ms,items){
 const rows=[],end=ms+3*dayMs;
 for(let from=ms;from<end;){
   const st=status(from),stop=boundary(from,end,st);
   if(st.work||st.timed){
     let t=from;
     while(t<stop){
       const next=items.find(item=>item.at>t&&item.at<=stop);
       const until=st.meal||st.pause||!next?stop:next.at;
       const label=st.meal?st.meal+'结束':st.pause?(st.pause.kind===0?'远眺结束':'离席结束'):
         next?'距离下次'+next.title:st.timed?'定时结束':'本段工作结束';
       rows.push({from:t,until,work:st.work,label});t=until;
     }
   }
   from=stop
 }
 return rows
}
// The native receipt survives process death. Persist the same round ID before acknowledging it.
function applyLockConfirmation(row){
 const {id,k,at,rest}=row;
 if(typeof id!=='string'||![0,1,2].includes(k)||!Number.isFinite(at)||data.logs.some(l=>l.id===id))return;
 const ms=Date.now(),end=at+Math.max(0,rest||0);
 if(data.cursor<at)settle(at);
 // Remove already accounted work inside the confirmed break, even if the app woke late.
 const countedUntil=Math.min(data.cursor,end);
 for(let t=at;t<countedUntil;){
   const st=status(t),stop=boundary(t,countedUntil,st);
   if(!st.meal&&!st.pause&&(st.work||st.timed||st.planned))
     data.totals[st.day]=Math.max(0,(data.totals[st.day]||0)-(stop-t));
   t=stop
 }
 if(end>data.cursor)data.pause={from:at,until:end,kind:k};
 const sameContext=status(at).day===status(ms).day&&status(at).work===status(ms).work&&status(at).timed===status(ms).timed;
 if(sameContext){restart(k);if(k===1)restart(0)}
 data.logs.unshift({id,k,at})
}
function viewKey(){const st=status(Date.now());return [st.day,st.work,st.meal,st.pause?.from,st.planned,st.timed,sessionEndsFirst(st,reminders()[0]),...[0,1,2].map(k=>frequency(k)>0&&!left(k)),...todayBlocks().map(b=>b.at<=time(now()))].join('|')}
let painted='',lastSaved=0;
function render(persist=true){settle();if(persist)save();painted=viewKey();document.title='Blink · '+tabs[tab];Array.from(el('nav').children).forEach((b,i)=>{if(i===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});[home,records,schedule][tab]();checkReminder();syncBackground()}
el('logo').innerHTML='<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#96dfc3" stroke="none" d="M3 14 Q14 24 29 12 Q19 31 4 20 Z"/><circle cx="21" cy="9" r="4" fill="#ffc58c" stroke="none"/></svg>';
function applyTheme(){const dark=data.theme==='dark'||(data.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#191b21':'#faf9f6'}
applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
tabs.forEach((label,i)=>{const b=document.createElement('button');b.innerHTML='<i>'+svg(['today','record','plan'][i])+'</i>'+label;b.onclick=()=>{if(i===2&&tab!==2){edit=scene();frequenciesOpen=false}tab=i;window.scrollTo(0,0);render()};el('nav').append(b)});
function refreshStored(){try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.cursor>data.cursor)data=loadMealTimes(saved)}catch{}}
document.addEventListener('visibilitychange',()=>{refreshStored();settle();visible=!document.hidden;render()});
window.addEventListener('pagehide',()=>{if(visible){refreshStored();settle();save()}});
window.addEventListener('storage',e=>{if(e.key===key&&e.newValue){const latest=JSON.parse(e.newValue);if(latest.cursor>=data.cursor){data=loadMealTimes(latest);if(!document.hidden)render(false)}}});
let nativePlanSignature='';
function syncFace(ms,plan=backgroundPlan(ms)){
 return window.blinkMobile.configureFace({auto:data.delivery?.autoFace!==false,timed:data.delivery?.lock!==false,rows:faceRows(ms,plan)})
}
function syncBackground(){
 if(!window.blinkMobile)return;
 const ms=Date.now(),pref=data.delivery||{},android=!window.blinkMobile.ios;
 const plan=pref.enabled||android?backgroundPlan(ms):[],items=pref.enabled?plan:[];
 if(android)syncFace(ms,plan).catch(()=>say('锁屏计时页未能更新'));
 const st=status(ms),current=st.work||st.timed||st.planned;
 const display=current&&pref.enabled?items[0]:null;
 const fingerprint=JSON.stringify([pref.enabled,pref.sound,pref.buzz,pref.lock,pref.wake,data.breakMinutes,items.map(i=>[i.k,Math.round(i.at/1000),i.retry]),display?.k]);
 if(nativePlanSignature===fingerprint)return;
 nativePlanSignature=fingerprint;
 const old=JSON.parse(localStorage.getItem('blink-pending')||'[]').filter(i=>i.at<=ms&&i.expires>ms);
 localStorage.setItem('blink-pending',JSON.stringify([...old,...items]));
 window.blinkMobile.replace(items,pref,display).catch(()=>{nativePlanSignature='';say('后台提醒未启动，请检查系统权限')})
}
let importingConfirmations=false;
async function importLockConfirmations(){
 if(importingConfirmations||!window.blinkMobile||window.blinkMobile.ios)return;
 importingConfirmations=true;
 try{
   const {rows}=await window.blinkMobile.confirmations();if(!rows.length)return;
   rows.sort((a,b)=>a.at-b.at).forEach(applyLockConfirmation);settle();
   localStorage.setItem(key,JSON.stringify(data));
   await window.blinkMobile.acknowledge(rows.map(r=>r.id));render();window.blinkAccounts?.changed()
 }finally{importingConfirmations=false}
}
if(window.blinkMobile){
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){importLockConfirmations().catch(()=>{});window.blinkMobile.consumeTap()}});
 window.blinkMobile.listen(token=>{
   if(data.card?.id===token){openReminder(token,false);return}
   const pending=JSON.parse(localStorage.getItem('blink-pending')||'[]'),ms=Date.now();
   const row=pending.find(x=>x.token===token&&x.at<=ms&&ms<=x.expires);
   if(!row){say('这条提醒已结束');return}
   localStorage.setItem('blink-pending',JSON.stringify(pending.filter(x=>x.token!==token)));
   settle();const st=status(ms);if(st.pause||st.meal||!frequency(row.k))return;
   data.progress[row.k]=Math.max(data.progress[row.k],frequency(row.k)*minute);
   data.card={id:token,k:row.k,round:row.round,until:ms+5*minute,retry:row.retry};openedReminder=token;tab=0;render()
 });
 importLockConfirmations().catch(()=>{});window.blinkMobile.consumeTap().catch(()=>{});
}
if(window.blinkDesktop){
 window.blinkDesktop.listen((id,yes)=>{
   if(yes)openReminder(id,true);else if(data.card?.id===id)deferReminder(data.card.k)
 });
 window.blinkDesktop.onResume(()=>{refreshStored();render()});
}
if(!window.blinkMobile&&!window.blinkDesktop&&'serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',event=>{
 if(event.data?.type==='blink-reminder')openReminder(event.data.id,event.data.confirm)
});
if(window.blinkCloudNative&&window.BlinkAccounts){
  window.blinkAccounts=window.BlinkAccounts({
    native:window.blinkCloudNative, modal, say, render, settle, save, createState, loadMealTimes, dayKey, midnight,
    get:()=>data, getKey:()=>key, guestKey,
    switchTo:(nextKey,state)=>{
      data=loadMealTimes(state);key=nextKey;
      if(!save())throw Error('保存失败');
      localStorage.setItem('blink-active-profile',key);localStorage.removeItem('blink-pending');
      nativePlanSignature='';posted='';openedReminder=null;paintCard(null);applyTheme();render();
    }
  });
}
render();
const landing=new URLSearchParams(location.hash.slice(1));
if(landing.has('reminder')){openReminder(landing.get('reminder'),landing.get('action')==='confirm');history.replaceState(null,'',location.href.split('#')[0])}
setInterval(()=>{if(document.hidden&&(window.blinkMobile||!systemEnabled()))return;settle();checkReminder();
 if(viewKey()!==painted){render()}else updateText();
 if(Date.now()-lastSaved>=10000){save();lastSaved=Date.now()}},1000);
</script></body></html>
