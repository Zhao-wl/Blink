limit_req_zone $binary_remote_addr zone=blink_public:2m rate=5r/s;
server {
    listen 80 default_server;
    server_name 47.108.62.243;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/blink-acme; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name 47.108.62.243;
    ssl_certificate /etc/letsencrypt/live/47.108.62.243/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.108.62.243/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    location ~ ^/(healthz|v1/(register|login|logout|sync)|v2/(sync|devices|revoke|recovery-code|password|reset|delete))$ {
        limit_req zone=blink_public burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18765;
    }
    location / { return 404; }
}
