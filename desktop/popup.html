<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Blink 提醒</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fff;
    --ink: #202639;
    --muted: #59637a;
    --line: #dce1eb;
    --accent: #503caf;
    --on-accent: #fff;
  }
  :root.dark {
    color-scheme: dark;
    --surface: #202432;
    --ink: #edf0fa;
    --muted: #b3bdd4;
    --line: #383e52;
    --accent: #cbbdff;
    --on-accent: #261b56;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 15px 16px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: 14px/1.45 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  img { width: 23px; height: 23px; border-radius: 6px; }
  p { margin: 8px 0 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  button {
    flex: 1;
    min-height: 36px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  button:first-child { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button:hover { box-shadow: inset 0 0 0 1px currentColor; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<header><img src="icon.png" alt=""><span id="reminderTitle"></span></header>
<p id="message"></p>
<div class="actions" id="actions"></div>
<script>
  const params=new URLSearchParams(location.search);
  document.documentElement.classList.toggle('dark',params.get('theme')==='dark');
  const actions=document.getElementById('actions');
  function add(label,answer){const b=document.createElement('button');b.textContent=label;b.onclick=()=>respond(answer);actions.append(b);return b}
  if(params.get('mode')==='prompt'){
    document.getElementById('reminderTitle').textContent='Blink · '+params.get('title');
    document.getElementById('message').textContent=params.get('body');
    for(const [code,label] of JSON.parse(params.get('actions')||'[]'))add(label,code);
  }else{
    const kind=Number(params.get('kind')),retry=params.get('retry')==='1';
    document.getElementById('reminderTitle').textContent='Blink · '+(retry?'再次提醒 · ':'')+['远眺','离席','喝水'][kind];
    document.getElementById('message').textContent=['看看远处，让眼睛休息一会儿。','方便的话，起来走动一下。','方便的话，喝一口水。'][kind];
    add(['开始远眺','开始离席','喝过了'][kind],true);
    add(params.get('later')||'5 分钟后',false);
  }
  // Enter confirms the first action, Esc picks the last one (later / skip).
  addEventListener('keydown',e=>{
    const buttons=actions.querySelectorAll('button');
    if(e.key==='Enter')buttons[0]?.click();
    if(e.key==='Escape')buttons[buttons.length-1]?.click();
  });
</script>
</html>
