<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Blink 提醒</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fff;
    --ink: #202639;
    --muted: #59637a;
    --line: #dce1eb;
    --accent: #503caf;
    --on-accent: #fff;
  }
  :root.dark {
    color-scheme: dark;
    --surface: #202432;
    --ink: #edf0fa;
    --muted: #b3bdd4;
    --line: #383e52;
    --accent: #cbbdff;
    --on-accent: #261b56;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 15px 16px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: 14px/1.45 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  img { width: 23px; height: 23px; border-radius: 6px; }
  p { margin: 8px 0 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  button {
    flex: 1;
    min-height: 36px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  button:first-child { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button:hover { box-shadow: inset 0 0 0 1px currentColor; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<header><img src="icon.png" alt=""><span id="reminderTitle"></span></header>
<p id="message"></p>
<div class="actions"><button id="yes"></button><button id="later"></button></div>
<script>
  const params=new URLSearchParams(location.search);
  const kind=Number(params.get('kind'));
  const retry=params.get('retry')==='1';
  const yes=document.getElementById('yes');
  const later=document.getElementById('later');
  document.documentElement.classList.toggle('dark',params.get('theme')==='dark');
  document.getElementById('reminderTitle').textContent='Blink · '+(retry?'再次提醒 · ':'')+['远眺','离席','喝水'][kind];
  document.getElementById('message').textContent=['看看远处，让眼睛休息 20 秒。','方便的话，起来走动一下。','方便的话，喝一口水。'][kind];
  yes.textContent=['开始远眺','开始离席','喝过了'][kind];
  later.textContent=retry?'跳过本轮':'稍后 5 分钟';
  yes.onclick=()=>respond(true);
  later.onclick=()=>respond(false);
</script>
</html>
